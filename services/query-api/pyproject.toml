[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "query-api"
version = "0.1.0"
description = "Query API service for CIP"
requires-python = ">=3.12"
dependencies = [
    "cip-obs",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "clickhouse-connect>=0.7.16",
    "pydantic-settings>=2.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/query_api"]
