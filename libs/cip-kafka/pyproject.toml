[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cip-kafka"
version = "0.1.0"
description = "Kafka producer and consumer wrappers for CIP"
requires-python = ">=3.12"
dependencies = [
    "cip-core",
    "confluent-kafka>=2.4.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cip_kafka"]
