[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cip-core"
version = "0.1.0"
description = "Core domain types, models and Avro codecs for CIP"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "fastavro>=1.9.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cip_core"]
